<script>/* @engine/stage-core.js */
/* =====================================================================
   stage-core.js · núcleo NEUTRAL para cualquier animación autocontenida
   ---------------------------------------------------------------------
   No sabe nada de estilo: sirve igual a Canvas 2D, SVG/DOM + GSAP,
   WebGL/GLSL, three.js o el motor pixel indexado. Aporta:

   · Línea de tiempo con escenas/planos + transiciones (progreso p)
   · Reproductor: loop, pausa, búsqueda, ?t=, ?record, ?capture, ?format=
   · Formatos: 9:16, 16:9, 1:1, 4:5, 21:9 o personalizado → recomponer, no estirar
   · Matemática de animación: easing, resortes, keyframes, stagger, ruido,
     hash/RNG con semilla (determinismo), color OKLab, beat/pulse
   · Contrato window.__anim para captura (capture.py) y auditoría (audit.py)
   · Registro de texto (STAGE.note / data-role) para auditar legibilidad
   · Enlace con audio-core.js (Score) en vivo y render offline

   Se inlinea con <script src="@engine/stage-core.js"><\/script>.
   Todo se exporta a window (clamp, lerp, E, tw, spring, track, rng, …) y STAGE.
   ===================================================================== */
(() => {
  const QS = new URLSearchParams(location.search);
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches || QS.has('rm');
  const CAPTURE = QS.has('capture');

  // ------------------------------------------------------------ matemática base
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const inv = (a, b, v) => clamp((v - a) / (b - a));
  const remap = (v, a0, a1, b0, b1, ez = x => x) => lerp(b0, b1, ez(inv(a0, a1, v)));
  const fract = x => x - Math.floor(x);
  const TAU = Math.PI * 2;

  // easing (todas t∈[0,1] → [0,1], algunas con overshoot)
  const E = {
    lin: t => t, inQ: t => t * t, outQ: t => 1 - (1 - t) * (1 - t), inOutQ: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    inC: t => t * t * t, outC: t => 1 - Math.pow(1 - t, 3), inOutC: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outQuart: t => 1 - Math.pow(1 - t, 4), inOutQuart: t => t < .5 ? 8 * t ** 4 : 1 - Math.pow(-2 * t + 2, 4) / 2,
    outQuint: t => 1 - Math.pow(1 - t, 5), inOutQuint: t => t < .5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2,
    inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10), outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
    inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
    inSine: t => 1 - Math.cos(t * Math.PI / 2), outSine: t => Math.sin(t * Math.PI / 2), inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outCirc: t => Math.sqrt(1 - Math.pow(t - 1, 2)), inOutCirc: t => t < .5 ? (1 - Math.sqrt(1 - (2 * t) ** 2)) / 2 : (Math.sqrt(1 - (-2 * t + 2) ** 2) + 1) / 2,
    inBack: (t, s = 1.70158) => (s + 1) * t * t * t - s * t * t,
    outBack: (t, s = 1.70158) => t <= 0 ? 0 : t >= 1 ? 1 : 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
    inOutBack: (t, s = 1.70158 * 1.525) => t < .5 ? (Math.pow(2 * t, 2) * ((s + 1) * 2 * t - s)) / 2 : (Math.pow(2 * t - 2, 2) * ((s + 1) * (t * 2 - 2) + s) + 2) / 2,
    outElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,

   y↓ ; rueda r=30 → el suelo está en y=+30. Largo total ≈ 185 unidades.
   ===================================================================== */
const MOTO = (() => {
  const R = 30, AX_R = -65, AX_F = 65;
  // Catmull-Rom → Bézier (curvas suaves a partir de puntos clave)
  const cr = (pts, closed = true, k = 1) => {
    const p = new Path2D(), n = pts.length, g = i => closed ? pts[((i % n) + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
    p.moveTo(pts[0][0], pts[0][1]);
    const last = closed ? n : n - 1;
    for (let i = 0; i < last; i++) {
      const a = g(i - 1), b = g(i), c = g(i + 1), d = g(i + 2);
      p.bezierCurveTo(b[0] + (c[0] - a[0]) * k / 6, b[1] + (c[1] - a[1]) * k / 6, c[0] - (d[0] - b[0]) * k / 6, c[1] - (d[1] - b[1]) * k / 6, c[0], c[1]);
    }
    if (closed) p.closePath();
    return p;
  };
  /* ---- formas (se construyen una vez) ---- */
  const SH = {
    // carrocería continua: carenado → tanque → cola (como la silueta del logo)
    body:    cr([[86, -38], [78, -56], [62, -70], [46, -76], [32, -80], [14, -81], [-6, -80], [-22, -70], [-46, -70], [-70, -76], [-90, -76], [-95, -68], [-80, -57], [-54, -48], [-30, -42], [-8, -37], [14, -33], [40, -25], [62, -21], [78, -27]], true),
    pad:     cr([[-22, -71], [-46, -74], [-71, -80], [-75, -75], [-47, -69], [-24, -66]], true),
    tankHi:  cr([[26, -78], [8, -82], [-8, -78], [-14, -72], [2, -74], [18, -74]], true),
    engine:  cr([[-24, -27], [8, -29], [26, -17], [23, 0], [-2, 8], [-28, 4], [-35, -10]], true),
    screen:  cr([[64, -70], [52, -92], [38, -99], [33, -84], [46, -77]], true),
  };
  const TAU = Math.PI * 2;
  const clampv = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const mixSkin = (a, b, k) => {
    const o = {}; for (const key in a) o[key] = (typeof a[key] === 'string' && a[key][0] === '#') ? mixColor(a[key], b[key], k) : (typeof a[key] === 'number' ? lerp(a[key], b[key], k) : (k < .5 ? a[key] : b[key])); return o;
  };
  const SKINS = {
    old:  { base: '#a79b82', hi: '#c6baa0', sh: '#756a58', trim: '#343944', rim: '#868c96', tire: '#25272c', wear: 1, st1: '#a79b82', st2: '#a79b82', stA: 0 },
    red:  { base: '#e01428', hi: '#ff6068', sh: '#8c0b1d', trim: '#1b2130', rim: '#e3e9f2', tire: '#13161c', wear: 0, st1: '#ffffff', st2: '#0d6fc0', stA: 1 },
    blue: { base: '#0d6fc0', hi: '#54b0f6', sh: '#07407c', trim: '#1b2130', rim: '#e3e9f2', tire: '#13161c', wear: 0, st1: '#ffffff', st2: '#e01428', stA: 1 },
  };
  // manchas de óxido y raspones (fijas)
  const RUST = (() => { const r = rng(5), a = []; for (let i = 0; i < 26; i++) a.push([-90 + r() * 170, -80 + r() * 70, 2 + r() * 6.5]); return a; })();
  const SCR = (() => { const r = rng(9), a = []; for (let i = 0; i < 9; i++) { const x = -80 + r() * 150, y = -78 + r() * 60; a.push([x, y, x + 6 + r() * 14, y + (r() - .5) * 10]); } return a; })();

  function paint(c, path, sk, o = {}) {
    const g = c.createLinearGradient(0, o.y0 ?? -90, 0, o.y1 ?? -34);
    g.addColorStop(0, sk.hi); g.addColorStop(.38, sk.base); g.addColorStop(1, sk.sh);
    c.fillStyle = g; c.fill(path);
    c.save(); c.clip(path);
    if (sk.stA > .01 && !o.noStripe) {            // franjas de marca
      c.globalAlpha = sk.stA; c.fillStyle = sk.st1; c.beginPath(); c.moveTo(-100, -56); c.lineTo(80, -78); c.lineTo(80, -70); c.lineTo(-100, -48); c.fill();
      c.fillStyle = sk.st2; c.beginPath(); c.moveTo(-100, -47); c.lineTo(80, -69); c.lineTo(80, -60); c.lineTo(-100, -38); c.fill(); c.globalAlpha = 1;
    }
    if (sk.wear > .3 && !o.noStripe) {            // panel de repuesto que no combina (azul desteñido) con tornillos
      c.fillStyle = `rgba(104,128,150,${.95 * sk.wear})`; c.beginPath(); c.moveTo(-76, -82); c.lineTo(-44, -82); c.lineTo(-48, -46); c.lineTo(-70, -48); c.fill();
      c.strokeStyle = `rgba(40,52,66,${.6 * sk.wear})`; c.lineWidth = 1.1; c.beginPath(); c.moveTo(-76, -82); c.lineTo(-70, -48); c.moveTo(-44, -82); c.lineTo(-48, -46); c.stroke();
      c.fillStyle = `rgba(46,52,60,${.9 * sk.wear})`; for (const [x, y] of [[-72, -76], [-49, -76], [-52, -54], [-67, -54]]) { c.beginPath(); c.arc(x, y, 1.6, 0, TAU); c.fill(); }
    }
    if (sk.wear > .01) {                          // óxido + raspones
      for (const [x, y, r] of RUST) { const gg = c.createRadialGradient(x, y, 0, x, y, r); gg.addColorStop(0, `rgba(138,70,34,${.85 * sk.wear})`); gg.addColorStop(.6, `rgba(120,62,30,${.5 * sk.wear})`); gg.addColorStop(1, 'rgba(120,62,30,0)'); c.fillStyle = gg; c.fillRect(x - r, y - r, r * 2, r * 2); }
      c.strokeStyle = `rgba(52,46,38,${.5 * sk.wear})`; c.lineWidth = .9; c.lineCap = 'round';
      for (const [a, b, c2, d] of SCR) { c.beginPath(); c.moveTo(a, b); c.lineTo(c2, d); c.stroke(); }
    }
    // brillo de arista (luz arriba-izquierda)
    c.strokeStyle = rgba('#ffffff', (o.rim ?? .35) * (1 - sk.wear * .6)); c.lineWidth = 2.2; c.stroke(path);
    if (o.shine != null) {                         // barrido de brillo
      const u = o.shine, gg = c.createLinearGradient(u - 30, -90, u + 6, -30); gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(.5, 'rgba(255,255,255,.75)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = gg; c.fillRect(u - 40, -100, 80, 130);
    }
    if (sk.dust > .01) { c.fillStyle = `rgba(150,138,118,${sk.dust * .55})`; c.fillRect(-100, -100, 200, 120); c.fillStyle = `rgba(214,204,186,${sk.dust * .35})`; c.beginPath(); c.ellipse(-20, -70, 70, 10, -.1, 0, TAU); c.fill(); }
    c.restore();
  }

  function wheel(c, x, y, ang, sk, o = {}) {
    const sag = o.sag || 0, dy = R * .1 * sag, isNew = o.isNew, ry = R * (1 - .1 * sag);
    c.save(); c.translate(x, y + dy);
    c.fillStyle = isNew ? sk.tire : sk.tire; c.beginPath(); c.ellipse(0, 0, R, ry, 0, 0, TAU); c.fill();
    c.strokeStyle = isNew ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.07)'; c.lineWidth = 2; c.setLineDash([3.2, 5.2]); c.lineDashOffset = -ang * R; c.beginPath(); c.arc(0, 0, R - 1.6, 0, TAU); c.stroke(); c.setLineDash([]);
    const rg = c.createLinearGradient(-18, -18, 18, 18); const rim = isNew ? sk.rim : '#7b818b'; rg.addColorStop(0, isNew ? '#ffffff' : '#a1a7b0'); rg.addColorStop(1, rim);
    c.fillStyle = rg; c.beginPath(); c.arc(0, 0, 21, 0, TAU); c.fill();
    c.fillStyle = isNew ? '#101420' : '#262a33'; c.beginPath(); c.arc(0, 0, 14.6, 0, TAU); c.fill();
    c.strokeStyle = isNew ? '#dfe6f0' : '#767c86'; c.lineWidth = 3.2; c.lineCap = 'round';
    for (let i = 0; i < 5; i++) { const a = ang + i * TAU / 5; c.beginPath(); c.moveTo(Math.cos(a) * 4, Math.sin(a) * 4); c.lineTo(Math.cos(a) * 14.4, Math.sin(a) * 14.4); c.stroke(); }
    c.fillStyle = isNew ? '#ffffff' : '#8d939c'; c.beginPath(); c.arc(0, 0, 4.4, 0, TAU); c.fill();
    if (!isNew) { c.fillStyle = 'rgba(140,74,36,.65)'; for (let i = 0; i < 4; i++) { const a = i * 1.7 + .5; c.beginPath(); c.arc(Math.cos(a) * 17, Math.sin(a) * 17, 2.4, 0, TAU); c.fill(); } }
    else { c.strokeStyle = sk.wear > .5 ? '#0d6fc0' : sk.base; c.lineWidth = 1.8; c.beginPath(); c.arc(0, 0, 19.6, 0, TAU); c.stroke(); }
    c.restore();
  }

  // ojo-faro: st = { lid, tilt, look:[x,y], happy, glow, pupil, bags, brow:[ang, lift], r }
  function eye(c, cx, cy, sk, st) {
    const r = (st.r || 14.5) * (1 + (st.wide || 0) * .12);
    c.save(); c.translate(cx, cy);
    if (st.glow > 0) { const gg = c.createRadialGradient(0, 0, r * .8, 0, 0, r * (1.9 + st.glow)); gg.addColorStop(0, `rgba(255,236,150,${.7 * st.glow})`); gg.addColorStop(1, 'rgba(255,236,150,0)'); c.fillStyle = gg; c.beginPath(); c.arc(0, 0, r * 3, 0, TAU); c.fill(); }
    // aro cromado
    c.fillStyle = '#1a1f2c'; c.beginPath(); c.arc(0, 0, r + 3.4, 0, TAU); c.fill();
    c.fillStyle = '#c9d0db'; c.beginPath(); c.arc(0, 0, r + 1.8, 0, TAU); c.fill();
    c.fillStyle = '#fbfcff'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    c.save(); c.beginPath(); c.arc(0, 0, r, 0, TAU); c.clip();
    const lk = st.look || [0, 0], px = lk[0] * r * .42, py = lk[1] * r * .42, pr = r * (st.pupil || .44);
    c.fillStyle = '#12161f'; c.beginPath(); c.arc(px, py, pr, 0, TAU); c.fill();
    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(px - pr * .32, py - pr * .34, pr * .3, 0, TAU); c.fill();
    c.beginPath(); c.arc(px + pr * .35, py + pr * .3, pr * .13, 0, TAU); c.fill();
    // párpado superior (con inclinación) del color de la carrocería oscurecido
    const lid = clampv(st.lid ?? 0, 0, 1.02), tilt = st.tilt || 0;
    if (lid > 0) {
      c.save(); c.rotate(tilt); const yy = -r + lid * r * 2.05; c.fillStyle = sk.sh; c.fillRect(-r * 1.6, -r * 1.8, r * 3.2, yy + r * 1.8);
      c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(-r * 1.6, yy); c.lineTo(r * 1.6, yy); c.stroke(); c.restore();
    }
    // mejilla / feliz: párpado inferior sube
    const hp = clampv(st.happy || 0);
    if (hp > 0) { const top = r * (.72 - .5 * hp); c.fillStyle = sk.base; c.beginPath(); c.ellipse(0, top + r * 1.1, r * 1.45, r * 1.1, 0, 0, TAU); c.fill(); c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1.5; c.beginPath(); c.ellipse(0, top + r * 1.1, r * 1.45, r * 1.1, 0, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); }
    c.restore();
    // ojeras (moto cansada)
    if (st.bags > 0) { c.strokeStyle = `rgba(40,30,30,${.5 * st.bags})`; c.lineWidth = 2.6; c.lineCap = 'round'; c.beginPath(); c.arc(0, r * .15, r + 5, .35, Math.PI - .35); c.stroke(); c.lineWidth = 1.6; c.beginPath(); c.arc(0, r * .15, r + 9, .55, Math.PI - .55); c.stroke(); }
    if (st.smile > 0) { c.strokeStyle = '#141824'; c.lineWidth = 3.4; c.lineCap = 'round'; c.beginPath(); c.arc(r * .35, r * .9, r * 1.05, .2 * Math.PI, (.2 + .6 * st.smile) * Math.PI); c.stroke(); }
    // ceja
    const br = st.brow || [0, 0];
    c.save(); c.translate(0, -r * 1.55 - br[1] * r * .4); c.rotate(br[0]); c.strokeStyle = '#141824'; c.lineWidth = 4.4; c.lineCap = 'round'; c.beginPath(); c.moveTo(-r * .85, 0); c.lineTo(r * .85, 0); c.stroke(); c.restore();
    c.restore();
  }

  function mirrorOld(c, sk) {          // espejo roto, torcido, con cinta
    c.save(); c.translate(36, -97); c.rotate(-.45); c.strokeStyle = '#4a4f59'; c.lineWidth = 3.6; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.lineTo(-3, -14); c.stroke();
    c.translate(-3, -15); c.rotate(-.55); c.fillStyle = '#31353f'; c.beginPath(); c.ellipse(0, 0, 11, 7.2, 0, 0, TAU); c.fill();
    c.fillStyle = '#9aa3ad'; c.beginPath(); c.ellipse(0, 0, 8.6, 5.3, 0, 0, TAU); c.fill();
    c.strokeStyle = '#2b2e36'; c.lineWidth = 1; c.beginPath(); c.moveTo(-6, -3); c.lineTo(1, 1); c.lineTo(5, -4); c.moveTo(1, 1); c.lineTo(-1, 5); c.stroke();
    c.fillStyle = 'rgba(190,190,180,.9)'; c.fillRect(-2, -9, 5, 9);
    c.restore();
  }
  function mirrorNew(c, sk) {
    c.save(); c.translate(36, -96); c.strokeStyle = '#d8dee8'; c.lineWidth = 3.4; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.lineTo(-3, -13); c.stroke();
    c.translate(-4, -15); c.fillStyle = sk.trim; c.beginPath(); c.ellipse(0, 0, 11.5, 7, -.1, 0, TAU); c.fill();
    const g = c.createLinearGradient(-8, -5, 8, 5); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#8fb8e6'); c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, 9, 5, -.1, 0, TAU); c.fill();
    c.restore();
  }

  /* ------------------------------------------------------------------
     MOTO.draw(c, o)
       o.x, o.y (punto de contacto del suelo), o.s (escala), o.flip
       o.pitch (rad, + = cabecea), o.wheelie (rad)
       o.skin  (objeto de SKINS o mezcla)  · o.parts {fw,rw,mir,seat,chain}
       o.eye   (ver eye())  · o.ang {f,r} giro de ruedas · o.sag (llanta baja 0-1)
       o.deco(c) dibuja detalles (nido, planta, telaraña) en coordenadas locales
       o.shine (x local del brillo que barre) · o.sq [sx,sy] squash
     ------------------------------------------------------------------ */
  function draw(c, o) {
    const sk = o.skin, P = o.parts || {}, ang = o.ang || { f: 0, r: 0 }, sag = o.sag || 0;
    c.save(); c.translate(o.x, o.y); c.scale((o.flip ? -1 : 1) * o.s, o.s);
    const sq = o.sq || [1, 1]; c.translate(0, 0); c.scale(sq[0], sq[1]);     // squash anclado al suelo (y local 0 = suelo)
    c.translate(0, -R);                                                        // ahora y=0 es la altura del eje
    if (o.wheelie) { c.translate(AX_R, R); c.rotate(-o.wheelie); c.translate(-AX_R, -R); }
    if (o.pitch) { c.translate(AX_F, R); c.rotate(o.pitch); c.translate(-AX_F, -R); }
    if (sag > 0) { c.translate(AX_F, R); c.rotate(-sag * .045); c.translate(-AX_F, -R); }
    const bob = o.bob || 0; c.translate(0, bob);
    c.lineJoin = 'round'; c.lineCap = 'round';

    // --- rueda trasera (atrás de todo)
    wheel(c, AX_R, 0, ang.r, sk, { isNew: P.rw, sag });
    // --- amortiguador + basculante
    c.strokeStyle = '#464c58'; c.lineWidth = 9; c.beginPath(); c.moveTo(-24, -1); c.lineTo(AX_R, 1); c.stroke();
    c.strokeStyle = '#c9d0db'; c.lineWidth = 4; c.beginPath(); c.moveTo(-38, -38); c.lineTo(-32, -8); c.stroke();
    c.strokeStyle = P.rw ? sk.base : '#c04a2a'; c.lineWidth = 3; c.setLineDash([2.4, 2.4]); c.beginPath(); c.moveTo(-37.4, -34); c.lineTo(-32.6, -12); c.stroke(); c.setLineDash([]);
    // cadena (nueva = brillante)
    c.strokeStyle = P.chain ? '#e8edf5' : '#6b4a32'; c.lineWidth = 2; c.setLineDash([1.6, 1.6]); c.beginPath(); c.moveTo(-20, 8); c.lineTo(AX_R, 13); c.stroke(); c.setLineDash([]);
    // --- escape
    c.strokeStyle = '#8f98a5'; c.lineWidth = 7; c.beginPath(); c.moveTo(-20, 8); c.quadraticCurveTo(-48, 14, -66, -8); c.stroke();
    c.save(); c.translate(-74, -15); c.rotate(-.36);
    const eg = c.createLinearGradient(0, -9, 0, 9); eg.addColorStop(0, P.rw ? '#f4f7fb' : '#aab2bd'); eg.addColorStop(1, P.rw ? '#8b95a5' : '#5d636d');
    c.fillStyle = eg; c.beginPath(); c.roundRect(-22, -6.5, 46, 13, 6.5); c.fill(); c.fillStyle = '#10131a'; c.beginPath(); c.ellipse(-22, 0, 2.8, 6, 0, 0, TAU); c.fill(); c.restore();
    // --- motor
    c.fillStyle = '#2a303c'; c.fill(SH.engine);
    c.strokeStyle = '#4b5362'; c.lineWidth = 1.6; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(-4 + i * 3, -30 + i * 9); c.lineTo(22, -26 + i * 8); c.stroke(); }
    c.fillStyle = '#a2abb8'; c.beginPath(); c.arc(-12, -4, 9, 0, TAU); c.fill(); c.fillStyle = '#444b58'; c.beginPath(); c.arc(-12, -4, 5.4, 0, TAU); c.fill();
    // --- rueda delantera + horquilla (detrás de la carrocería)
    c.strokeStyle = '#c7cfda'; c.lineWidth = 5.6; c.beginPath(); c.moveTo(44, -60); c.lineTo(AX_F, 0); c.stroke();
    c.strokeStyle = '#3a404c'; c.lineWidth = 8.4; c.beginPath(); c.moveTo(56, -26); c.lineTo(AX_F, 0); c.stroke();
    wheel(c, AX_F, 0, ang.f, sk, { isNew: P.fw });
    c.strokeStyle = P.fw ? '#dfe5ee' : '#8a909a'; c.lineWidth = 2.4; c.beginPath(); c.arc(AX_F, 0, 13.4, -.4, 2.2); c.stroke();                       // disco de freno
    c.fillStyle = P.fw ? (sk.wear > .5 ? '#0d6fc0' : sk.base) : '#b05a2a'; c.beginPath(); c.roundRect(AX_F - 20, -9, 8, 12, 2); c.fill();                                           // pinza
    // --- carrocería continua
    paint(c, SH.body, sk, { y0: -86, y1: -22, shine: o.shine });
    c.save(); c.clip(SH.body); c.fillStyle = `rgba(255,255,255,${.22 * (1 - sk.wear * .7)})`; c.fill(SH.tankHi); c.restore();
    // separación carenado/tanque (línea de panel)
    c.strokeStyle = 'rgba(0,0,0,.22)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(30, -80); c.quadraticCurveTo(24, -62, 30, -35); c.stroke();
    // asiento
    if (P.seat) { c.fillStyle = '#10141c'; c.fill(SH.pad); c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 1.2; c.stroke(SH.pad); }
    else {
      c.fillStyle = '#6a5a43'; c.fill(SH.pad); c.strokeStyle = '#2b241a'; c.lineWidth = 1.2; c.stroke(SH.pad);
      c.strokeStyle = 'rgba(205,205,196,.95)'; c.lineWidth = 3; c.beginPath(); c.moveTo(-52, -76); c.lineTo(-44, -68); c.moveTo(-44, -76); c.lineTo(-52, -68); c.stroke();   // cinta gris
    }
    // cinta en X sobre el tanque (moto vieja)
    if (sk.wear > .5) { c.save(); c.clip(SH.body); c.strokeStyle = `rgba(214,214,206,${.92 * sk.wear})`; c.lineWidth = 3.6; c.beginPath(); c.moveTo(-8, -76); c.lineTo(14, -52); c.moveTo(14, -78); c.lineTo(-6, -52); c.stroke(); c.restore(); }
    // parabrisas
    c.fillStyle = 'rgba(20,30,52,.5)'; c.fill(SH.screen); c.strokeStyle = 'rgba(255,255,255,.42)'; c.lineWidth = 1; c.stroke(SH.screen);
    // --- manillar + espejo
    c.strokeStyle = '#161a24'; c.lineWidth = 5; c.beginPath(); c.moveTo(34, -82); c.lineTo(20, -85); c.stroke();
    if (P.mir) mirrorNew(c, sk); else mirrorOld(c, sk);
    // --- decoraciones del mundo (nido, planta, telaraña) en coords locales
    if (o.deco) o.deco(c);
    // --- el ojo
    if (o.eye) eye(c, 55, -52, sk, o.eye);
    c.restore();
  }
  return { draw, wheel, eye, mirrorNew, SKINS, mixSkin, cr, SH, R, AX_R, AX_F };
})();

</script>
<script>/* ./lib.js */
/* =====================================================================
   lib.js · utilidades de la pieza "AHORITA": paleta, texto, burbujas,
   destellos, fondos y props. Todo es función pura del tiempo.
   ===================================================================== */
const W = 1080, H = 1920;
const C = {
  navy: '#0a1430', ink: '#0e1424', blue: '#0d6fc0', blueL: '#54b0f6', blueD: '#07407c',
  red: '#e01428', redL: '#ff5a64', redD: '#8c0b1d', white: '#ffffff', cream: '#f6f1e4', yellow: '#ffcf3d',
};
const FD = 'Anton, Impact, "Arial Narrow", sans-serif', FT = 'Inter, system-ui, sans-serif';
const GROUND = 1310;                         // y del suelo (en el mundo)
const CX = 490;                              // centro óptico de textos (zona segura TikTok: x ≤ 929)
const pop = (t, t0, d = .28, s = 2.6) => E.outBack(inv(t0, t0 + d, t), s);
const fadeIn = (t, a, b) => E.outC(inv(a, b, t));
const fadeOut = (t, a, b) => 1 - E.inC(inv(a, b, t));
const win = (t, a, b, fi = .15, fo = .2) => Math.min(inv(a, a + fi, t), 1 - inv(b - fo, b, t));   // ventana con entrada/salida

/* ------------------------------------------------ texto */
const _cap = {};
function capH(c, font, size) { const k = font + size; if (_cap[k] == null) { c.save(); c.font = `${size}px ${font}`; _cap[k] = c.measureText('H').actualBoundingBoxAscent; c.restore(); } return _cap[k]; }
function txt(c, str, x, y, o = {}) { return STAGE.txt(c, str, x, y, { font: FD, weight: 400, ...o }); }
// pastilla con texto centrado; o: {size, bg, fg, px, py, r, sc, rot, font, weight, alpha, shadow, maxW}
function pill(c, str, x, y, o = {}) {
  const size = o.size || 100, font = o.font || FD, weight = o.weight ?? 400, px = o.px ?? size * .34, py = o.py ?? size * .2, sc = o.sc ?? 1;
  c.save(); c.translate(x, y); c.rotate(o.rot || 0); c.scale(sc, sc); c.globalAlpha *= o.alpha ?? 1;
  c.font = `${weight} ${size}px ${font}`; if ('letterSpacing' in c) c.letterSpacing = (o.tracking || 0) + 'px';
  const w = c.measureText(str).width, ch = capH(c, font, size), bw = w + px * 2, bh = ch + py * 2;
  if (o.bg) { c.shadowColor = 'rgba(4,10,28,.38)'; c.shadowBlur = size * .22; c.shadowOffsetY = size * .08; c.fillStyle = o.bg; c.beginPath(); c.roundRect(-bw / 2, -bh / 2, bw, bh, o.r ?? bh * .24); c.fill(); c.shadowColor = 'transparent'; }
  c.restore();
  c.save(); c.translate(x, y); c.rotate(o.rot || 0); c.scale(sc, sc); c.globalAlpha *= o.alpha ?? 1;
  txt(c, str, 0, ch / 2, { size, font, weight, fill: o.fg || '#fff', tracking: o.tracking, shadow: o.shadow, role: o.role || 'key' });
  c.restore();
  return bw * sc;
}
// burbuja de diálogo. o: {tail:[x,y] punta, tx (x de la base de la cola), bg, fg, size, alpha, sc}
function bubble(c, str, x, y, o = {}) {
  const size = o.size || 56, font = FT, weight = 800, px = size * .62, py = size * .5, sc = o.sc ?? 1;
  c.save(); c.font = `${weight} ${size}px ${font}`; const tw = Math.min(c.measureText(str).width, o.maxW || 9999), bw = tw + px * 2, bh = size + py * 2; c.restore();
  c.save(); c.translate(x, y); c.scale(sc, sc); c.globalAlpha *= o.alpha ?? 1;
  c.shadowColor = 'rgba(4,10,28,.4)'; c.shadowBlur = 26; c.shadowOffsetY = 10; c.fillStyle = o.bg || '#fff';
  c.beginPath(); c.roundRect(-bw / 2, -bh / 2, bw, bh, bh * .36); c.fill();
  if (o.tail) { const [tx, ty] = o.tail, bx = clamp(o.tx ?? tx, -bw / 2 + bh * .5, bw / 2 - bh * .5), dir = ty < 0 ? -1 : 1; c.beginPath(); c.moveTo(bx - 22, dir * (bh / 2 - 2)); c.lineTo(tx, ty); c.lineTo(bx + 22, dir * (bh / 2 - 2)); c.closePath(); c.fill(); }
  c.shadowColor = 'transparent'; c.restore();
  c.save(); c.translate(x, y); c.scale(sc, sc); c.globalAlpha *= o.alpha ?? 1;
  if (o.shown != null) {
    c.save(); c.font = `800 ${size}px ${font}`; const full = c.measureText(str).width; c.restore();
    c.save(); c.font = `800 ${size}px ${font}`; c.textAlign = 'left'; c.fillStyle = o.fg || '#0e1424'; c.fillText(o.shown, -full / 2, size * .34); c.restore();   // texto parcial: sin registrar (sólo cuenta el completo)
    const tr = c.getTransform(), sx = Math.hypot(tr.a, tr.b);
    STAGE.note(str, tr.e - full / 2 * sx, tr.f + (size * .34 - size * .72) * sx, full * sx, size * .95 * sx, size * .72 * sx, 'key');
  }
  else txt(c, str, 0, size * .34, { size, font, weight: 800, fill: o.fg || '#0e1424', maxW: o.maxW, role: o.role || 'key' });
  c.restore();

}

/* ------------------------------------------------ destellos y efectos */
function star4(c, x, y, r, rot = 0, col = '#fff') {
  c.save(); c.translate(x, y); c.rotate(rot); c.fillStyle = col; c.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .22 : r; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.closePath(); c.fill(); c.restore();
}
// ráfaga de chispas desde (x,y) a partir de t0 (sin estado)
function sparks(c, T, t0, x, y, n = 14, life = .7, R = 160, seed = 1, col = '#fff') {
  const a = T - t0; if (a < 0 || a > life) return;

    const r = rng(seed * 131 + i * 17), ang = r() * TAU, d = (.35 + r() * .65) * R, k = a / life, e = E.outC(k);
    const px = x + Math.cos(ang) * d * e, py = y + Math.sin(ang) * d * e + 40 * k * k;
    star4(c, px, py, (10 + r() * 16) * (1 - k * k), ang + k * 2, col);
  }
}
function ring(c, T, t0, x, y, R = 220, life = .5, col = '#fff', lw = 10) {
  const a = (T - t0) / life; if (a < 0 || a > 1) return; const e = E.outQuart(a);
  c.save(); c.strokeStyle = rgba(col, (1 - a) * .9); c.lineWidth = lw * (1 - a) + 1; c.beginPath(); c.arc(x, y, R * e, 0, TAU); c.stroke(); c.restore();
}
function speedLines(c, T, y0, y1, dir = 1, alpha = .5, seed = 3, n = 26) {
  c.save(); c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const r = rng(seed * 77 + i), y = lerp(y0, y1, r()), len = 160 + r() * 380, sp = 2600 + r() * 2200, x = ((r() * (W + 800) + dir * T * sp) % (W + 800) + (W + 800)) % (W + 800) - 400;
    c.strokeStyle = rgba('#ffffff', alpha * (.35 + r() * .65)); c.lineWidth = 3 + r() * 5; c.beginPath(); c.moveTo(x, y); c.lineTo(x - dir * len, y); c.stroke();
  }
  c.restore();
}
function puffs(c, T, t0, x, y, n = 6, life = .9, dx = -40, dy = -90, size = 20, col = '#cfd6e2', seed = 4) {
  for (let i = 0; i < n; i++) {
    const a = T - t0 - i * .09; if (a < 0 || a > life) continue; const k = a / life, r = rng(seed * 31 + i)();
    c.fillStyle = rgba(col, .6 * (1 - k)); c.beginPath(); c.arc(x + dx * k * (.6 + r) + Math.sin(k * 6 + i) * 6, y + dy * k, size * (.6 + k * 1.6), 0, TAU); c.fill();
  }
}

/* ------------------------------------------------ grano + viñeta (precalculado) */

      for (let i = 0; i < d.length; i += 4) { const n = r(), v = n > .5 ? 255 : 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = Math.abs(n - .5) * 2 * 26; }

    const rg = g.createRadialGradient(135, 230, 120, 135, 240, 330); rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,1)'); g.fillStyle = rg; g.fillRect(0, 0, 270, 480); GRAIN.vig = v;

}

/* ------------------------------------------------ logo (vectorizado del original) */
function drawLogo(c, cx, cy, w, o = {}) {

/* ------------------------------------------------ fondos */
const sky = (day) => ({ t: mixColor('#070d24', '#79bff5', day), b: mixColor('#1b2650', '#e8f4ff', day) });
function garageBg(c, T, day, clockT, spin) {
  // pared
  const wall = [mixColor('#2c374a', '#6a7b93', day), mixColor('#1d2635', '#46556b', day)];
  let g = c.createLinearGradient(0, 0, 0, GROUND); g.addColorStop(0, wall[0]); g.addColorStop(1, wall[1]); c.fillStyle = g; c.fillRect(0, 0, W, GROUND + 4);
  // paneles verticales muy suaves (garage)
  c.fillStyle = 'rgba(0,0,0,.05)'; for (let x = 0; x < W; x += 180) c.fillRect(x, 0, 6, GROUND);
  // zócalo + piso
  c.fillStyle = mixColor('#202a3a', '#394860', day); c.fillRect(0, GROUND - 70, W, 74);
  g = c.createLinearGradient(0, GROUND, 0, H); g.addColorStop(0, mixColor('#161d2a', '#2c3a4e', day)); g.addColorStop(1, '#0d121b'); c.fillStyle = g; c.fillRect(0, GROUND, W, H - GROUND);
  c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(0, GROUND, W, 3);
  // ventana (derecha) con sol/luna
  const wx = 700, wy = 600, ww = 250, wh = 270, s = sky(day);
  c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 24; c.fillStyle = '#9aa7ba'; c.fillRect(wx - 14, wy - 14, ww + 28, wh + 28); c.restore();
  g = c.createLinearGradient(0, wy, 0, wy + wh); g.addColorStop(0, s.t); g.addColorStop(1, s.b); c.fillStyle = g; c.fillRect(wx, wy, ww, wh);
  c.save(); c.beginPath(); c.rect(wx, wy, ww, wh); c.clip();
  const cyc = spin ? fract((T - 2) * 1.0 + .25) : fract(.62);   // el sol alcanza su punto más alto cuando la luz es máxima
  const sx = wx + ww * lerp(-.1, 1.1, cyc), sy = wy + wh * (.78 - .62 * Math.sin(Math.PI * clamp(cyc, 0, 1)));
  c.fillStyle = rgba('#fff3b0', .35 + .65 * day); c.beginPath(); c.arc(sx, sy, 34, 0, TAU); c.fill();
  const mc = fract(cyc + .5), mx = wx + ww * lerp(-.1, 1.1, mc), my = wy + wh * (.78 - .62 * Math.sin(Math.PI * mc)); c.fillStyle = rgba('#e8efff', (1 - day) * .95); c.beginPath(); c.arc(mx, my, 24, 0, TAU); c.fill();
  c.restore();
  c.fillStyle = '#9aa7ba'; c.fillRect(wx + ww / 2 - 6, wy, 12, wh); c.fillRect(wx, wy + wh / 2 - 6, ww, 12);
  // haz de luz hacia la escena
  c.save(); c.globalAlpha = .08 + .2 * day; g = c.createLinearGradient(wx, wy, wx - 420, wy + 640); g.addColorStop(0, '#fff6cf'); g.addColorStop(1, 'rgba(255,246,207,0)'); c.fillStyle = g;
  c.beginPath(); c.moveTo(wx, wy); c.lineTo(wx + ww, wy); c.lineTo(wx + ww - 320, GROUND); c.lineTo(wx - 560, GROUND); c.closePath(); c.fill(); c.restore();
  // motas de polvo en el haz
  for (let i = 0; i < 34; i++) { const r = rng(40 + i), u = r(), x = lerp(wx + ww - 40, wx - 430, u) + Math.sin(T * (.5 + r()) + i) * 14, y = lerp(wy + 40, GROUND - 120, u) + Math.cos(T * (.4 + r()) + i * 2) * 12; c.fillStyle = rgba('#fff', (.2 + .5 * r()) * (.15 + .6 * day)); c.beginPath(); c.arc(x, y, 1.6 + r() * 2.6, 0, TAU); c.fill(); }
  // reloj de pared (izquierda)
  clock(c, 150, 722, 78, clockT);
  // foco cálido detrás de la moto (la hace despegar del fondo)
  g = c.createRadialGradient(500, 1010, 60, 500, 1030, 640); g.addColorStop(0, `rgba(255,214,150,${.10 + .12 * day})`); g.addColorStop(1, 'rgba(255,214,150,0)'); c.fillStyle = g; c.fillRect(0, 500, W, 900);
}
function clock(c, x, y, r, t) {
  c.save(); c.translate(x, y); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 20; c.shadowOffsetY = 8;
  c.fillStyle = '#1b2230'; c.beginPath(); c.arc(0, 0, r + 10, 0, TAU); c.fill(); c.shadowColor = 'transparent';
  c.fillStyle = '#f2ede0'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
  c.strokeStyle = '#2b3342'; c.lineWidth = 4; for (let i = 0; i < 12; i++) { const a = i * TAU / 12; c.beginPath(); c.moveTo(Math.sin(a) * (r - 14), -Math.cos(a) * (r - 14)); c.lineTo(Math.sin(a) * (r - 4), -Math.cos(a) * (r - 4)); c.stroke(); }
  const m = t * TAU, h = t * TAU / 12; c.lineCap = 'round';
  c.strokeStyle = '#1b2230'; c.lineWidth = 7; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.sin(h) * r * .5, -Math.cos(h) * r * .5); c.stroke();
  c.lineWidth = 4.6; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.sin(m) * r * .78, -Math.cos(m) * r * .78); c.stroke();
  c.fillStyle = '#e01428'; c.beginPath(); c.arc(0, 0, 6, 0, TAU); c.fill();
  c.restore();
}
// escenario de marca (azul vivo)
let DOTS = null;
function brandBg(c, T, o = {}) {
  const k = o.k ?? 1;
  let g = c.createRadialGradient(W * .5, H * .36, 60, W * .5, H * .5, 1250); g.addColorStop(0, o.c0 || '#2b9bf0'); g.addColorStop(.5, o.c1 || '#0f63b8'); g.addColorStop(1, o.c2 || '#062a63'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  // bandas diagonales suaves
  c.save(); c.globalAlpha = .12; c.fillStyle = '#fff'; for (let i = 0; i < 4; i++) { const x = ((i * 380 + T * 38) % 1500) - 300; c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 150, 0); c.lineTo(x - 450, H); c.lineTo(x - 600, H); c.closePath(); c.fill(); } c.restore();
  // puntos de media tinta
  if (!DOTS) { DOTS = document.createElement('canvas'); DOTS.width = 540; DOTS.height = 960; const d = DOTS.getContext('2d'); d.fillStyle = '#fff'; for (let y = 0; y < 960; y += 30) for (let x = ((y / 30) % 2) * 15; x < 540; x += 30) { const rr = 2.2 * (1 - y / 1100); d.beginPath(); d.arc(x, y, rr, 0, TAU); d.fill(); } }
  c.save(); c.globalAlpha = .1; c.drawImage(DOTS, 0, 0, W, H); c.restore();
  // piso
  g = c.createLinearGradient(0, GROUND - 30, 0, H); g.addColorStop(0, 'rgba(4,22,60,.0)'); g.addColorStop(.08, 'rgba(4,22,60,.55)'); g.addColorStop(1, 'rgba(3,12,34,.95)'); c.fillStyle = g; c.fillRect(0, GROUND - 30, W, H - GROUND + 30);
  c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(0, GROUND, W, 3);
}
function ctaBg(c, T) {
  let g = c.createRadialGradient(W * .5, H * .3, 60, W * .5, H * .5, 1300); g.addColorStop(0, '#16397c'); g.addColorStop(.55, '#0a1d49'); g.addColorStop(1, '#050c22'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.globalAlpha = .07; if (DOTS) c.drawImage(DOTS, 0, 0, W, H); c.restore();
  // cinta tricolor en la zona inferior (no lleva texto: la interfaz de TikTok la tapa)
  c.save(); c.translate(W / 2, 1735 + Math.sin(T * .8) * 6); c.rotate(-.17);
  c.fillStyle = C.red; c.fillRect(-1000, -70, 2000, 86); c.fillStyle = '#fff'; c.fillRect(-1000, 16, 2000, 20); c.fillStyle = C.blue; c.fillRect(-1000, 36, 2000, 52);
  c.restore();
  // brillo suave arriba del logo
  g = c.createRadialGradient(W * .5, 330, 10, W * .5, 330, 520); g.addColorStop(0, 'rgba(120,180,255,.22)'); g.addColorStop(1, 'rgba(120,180,255,0)'); c.fillStyle = g; c.fillRect(0, 0, W, 800);
}
/* ------------------------------------------------ props de abandono */
function nest(c, k, T) {            // nido sobre el asiento (coords locales de la moto), k 0..1
  if (k <= 0) return; const s = E.outBack(k, 2.4);
  c.save(); c.translate(-48, -79); c.scale(s, s);
  c.fillStyle = '#6b4a2a'; c.beginPath(); c.ellipse(0, 0, 17, 7, 0, 0, TAU); c.fill();
  c.strokeStyle = '#8a6238'; c.lineWidth = 1.6; c.lineCap = 'round'; const r = rng(77); for (let i = 0; i < 14; i++) { const a = r() * TAU, d = r() * 13; c.beginPath(); c.moveTo(Math.cos(a) * d - 6, Math.sin(a) * d * .35); c.lineTo(Math.cos(a) * d + 6, Math.sin(a) * d * .35 - 2 + r() * 3); c.stroke(); }
  c.restore();
}
function eggs(c, T, t0) {            // huevos que asoman uno a uno
  for (let i = 0; i < 3; i++) { const k = pop(T, t0 + i * .16, .22, 3); if (k <= 0) continue; c.save(); c.translate(-54 + i * 6.4, -83 - Math.abs(Math.sin(k * 3)) * 0); c.scale(k, k); c.fillStyle = '#9fd6e8'; c.beginPath(); c.ellipse(0, 0, 4, 5.2, .15 * (i - 1), 0, TAU); c.fill(); c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-1.2, -1.8, 1.1, 1.8, 0, 0, TAU); c.fill(); c.restore(); }
}
function sprout(c, k, T) {          // planta que crece del escape
  if (k <= 0) return; const h = 34 * E.outCirc(k), sw = Math.sin(T * 2.2) * 2 * k;
  c.save(); c.translate(-92, -10); c.strokeStyle = '#5da84a'; c.lineWidth = 3.4; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(sw, -h * .5, sw * 1.6, -h); c.stroke();
  const lk = E.outBack(inv(.45, 1, k), 2); c.fillStyle = '#7ccf5d'; for (const sgn of [-1, 1]) { c.save(); c.translate(sw * 1.6, -h); c.rotate(sgn * (.9 + Math.sin(T * 3) * .06)); c.scale(lk, lk); c.beginPath(); c.ellipse(sgn * 7, -3, 9, 4.6, sgn * -.2, 0, TAU); c.fill(); c.restore(); }
  c.restore();
}

<script>

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

/* ------------------------------------------------ utilidades de tiempo */
const blink = (T, list) => { let b = 0; for (const t0 of list) { const d = T - t0; if (d > 0 && d < .16) b = Math.max(b, Math.sin(d / .16 * Math.PI)); } return b; };
const BL = [1.2, 3.2, 5.3, 8.9, 12.7, 15.2, 18.1];
const lerpA = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
function shadowAt(c, x, y, w, a = .4) { c.save(); c.fillStyle = `rgba(2,6,18,${a})`; c.beginPath(); c.ellipse(x, y + 6, w * .5, w * .06, 0, 0, TAU); c.fill(); c.fillStyle = `rgba(2,6,18,${a * .6})`; c.beginPath(); c.ellipse(x, y + 6, w * .36, w * .035, 0, 0, TAU); c.fill(); c.restore(); }
const L2W = (o, lx, ly) => [o.x + (o.flip ? -1 : 1) * o.s * lx, o.y + o.s * (ly - 30)];

/* ------------------------------------------------ moto vieja (protagonista) */
const OLD_BEATS = { fw: 10.5, rw: 11.0, mir: 11.5, seat: 12.0, chain: 12.5, sweep: 13.0, sweepD: .45 };
function oldPose(T) {
  const lap = T >= 7 && T < 10;
  if (T >= 14) return { x: 730, y: 735, s: 2.2, flip: true };
  if (lap) return { x: 270, y: GROUND, s: 3.3, flip: false };
  if (T >= 10) return { x: 470, y: GROUND, s: 4.7, flip: false };
  return { x: 480, y: GROUND, s: 4.5, flip: false };
}
function oldEye(T) {
  const e = { lid: .46, tilt: .05, look: [noise1(T * .6, 1) * .12, noise1(T * .5, 2) * .08], bags: 1, brow: [.1, -.15], glow: 0, wide: 0, pupil: .44, happy: 0, smile: 0 };
  if (T < 2.1) {
    if (T < 1.45) { const g = track([[0, [0, 0]], [.4, [0, 0]], [.55, [.75, .12], E.outC], [.95, [.75, .12]], [1.08, [-.35, 0], E.outC], [1.35, [0, 0], E.inOutC]])(T); e.look = [g[0] + e.look[0] * .3, g[1] + e.look[1] * .3]; }
    if (T >= 1.45) { const k = inv(1.45, 2.1, T), a = lerp(Math.PI, TAU, E.inOutSine(k)), w = E.outC(inv(0, .15, k)) * (1 - E.inC(inv(.85, 1, k))); e.look = [Math.cos(a) * .85 * w, Math.sin(a) * .85 * w - .05]; e.lid = lerp(.46, .26, w); e.brow = [.1 - .35 * w, -.15 + .8 * w]; }
  } else if (T < 6.4) {
    e.lid = lerp(.46, .64, inv(2, 5.5, T)); e.bags = 1;
    const tr = track([[2, [0, 0]], [4.1, [0, 0]], [4.28, [-.95, -.1], E.outC], [4.95, [-.95, -.1]], [5.12, [0, 0], E.outC]])(T); e.look = [tr[0] + e.look[0] * .3, tr[1] + e.look[1] * .3];
    e.brow = [.14, -.2];
  } else if (T < 8.0) {
    const k = E.outC(inv(6.4, 6.55, T)); e.lid = lerp(.64, -.02, k); e.wide = k; e.pupil = lerp(.44, .26, k); e.look = [lerp(e.look[0], 1, k) + shake(T, .03, 3, 30).x, lerp(e.look[1], -.05, k)]; e.brow = [0, lerp(-.2, .9, k)]; e.bags = 1 - k * .5;
  } else if (T < 10.0) {
    const k = E.outC(inv(8.0, 8.3, T)); e.lid = lerp(-.02, .34, k); e.wide = (1 - k) * .6; e.pupil = lerp(.26, .42, k); e.brow = [lerp(0, -.2, k), lerp(.9, .35, k)]; e.bags = .6;
    const lk = track([[8.0, [1, -.05]], [8.5, [1, -.05]], [8.7, [1, -.7], E.outC], [9.4, [1, -.7]], [9.6, [.2, 0], E.outC]])(T); e.look = lk;
  } else if (T < 13.0) {
    const hope = inv(10.0, 12.6, T); e.lid = lerp(.34, 0, E.outC(inv(10, 10.6, T))); e.pupil = .46; e.brow = [-.08, .55]; e.bags = lerp(.6, .1, hope); e.glow = .15 + .55 * hope; e.look = [noise1(T * 1.5, 4) * .15, -.1 + noise1(T, 5) * .1];
    const pops = [10.5, 11, 11.5, 12, 12.5].map(t => impulse(T, t, 9)); const pk = Math.max(...pops); e.wide = pk * .5; e.pupil = lerp(.46, .3, pk);
  } else {
    const k = E.outC(inv(13.0, 13.45, T)); e.lid = 0; e.bags = lerp(.1, 0, k); e.happy = k; e.smile = k; e.glow = lerp(.7, .95, k); e.brow = [0, lerp(.55, .8, k)]; e.pupil = .46; e.look = [0, 0];
  }
  const b = blink(T, BL); if (b > 0) e.lid = Math.max(e.lid, b * 1.02);
  return e;
}
function oldDecay(T) {
  return { dust: lerp(.14, .85, inv(2.2, 5.6, T)), nest: inv(4.0, 4.5, T), sprout: inv(3.0, 5.2, T), sag: E.inOutSine(inv(3.2, 5.0, T)) };
}
function drawOldMoto(c, T) {
  const P = oldPose(T), dc = oldDecay(T), B = OLD_BEATS;
  const parts = { fw: T >= B.fw, rw: T >= B.rw, mir: T >= B.mir, seat: T >= B.seat, chain: T >= B.chain };
  const isCTA = T >= 14;
  // respiración / rebote
  const breathe_ = 1 + Math.sin(T * 2.2) * .008;
  let sq = [1 / Math.sqrt(breathe_), breathe_], bob = 0;
  // motor que tose al compás (gancho)
  if (T < 2.2) for (const t of [0, .5, 1.0, 1.55]) { const k = impulse(T, t, 13); sq = [sq[0] * (1 + .014 * k), sq[1] * (1 - .02 * k)]; bob -= 1.6 * k; }
  // clic de cada pieza: pequeño squash
  for (const t of [B.fw, B.rw, B.mir, B.seat, B.chain]) { const k = impulse(T, t, 11); sq = [sq[0] * (1 + .03 * k), sq[1] * (1 - .045 * k)]; }
  // salto de felicidad
  if (T >= 13.45 && T < 14) { const k = (T - 13.45) / .5; bob = -Math.sin(Math.PI * k) * 10; }
  // temblor de motor lejano antes de la llegada
  const trem = T > 6.5 && T < 7 ? shake(T, 2.4 * inv(6.5, 6.9, T), 9, 40) : { x: 0, y: 0 };
  const sagNow = parts.rw ? 0 : dc.sag;
  const o = { ...P, x: P.x + trem.x, y: P.y + trem.y, sq, bob, ang: { f: 0, r: 0 }, sag: sagNow, parts, eye: oldEye(T) };
  if (T >= 14) { o.eye = { lid: 0, bags: 0, happy: 1, smile: 1, glow: .95, look: [.4, 0], brow: [0, .8], pupil: .46 }; const bk = blink(T, [18.0, 18.2]); if (bk > 0) { o.eye.lid = bk; o.eye.happy = 1 - bk; } }
  // ruedas que giran al encajar
  const spin = t => E.outQuart(inv(t, t + .7, T)) * 9;
  o.ang = { f: parts.fw ? spin(B.fw) : 0, r: parts.rw ? spin(B.rw) : 0 };
  const swp = clamp(inv(B.sweep, B.sweep + B.sweepD, T));
  const mkDeco = (T_) => (cc) => { sprout(cc, dc.sprout, T_); nest(cc, dc.nest, T_); eggs(cc, T_, 4.45); for (const [t0, sd] of [[0, 11], [.5, 12], [1.0, 13], [1.55, 3]]) puffs(cc, T_, t0, -96, -8, t0 === 1.55 ? 7 : 3, t0 === 1.55 ? 1.0 : .7, -22, -34, t0 === 1.55 ? 5 : 3.4, '#cfd6e2', sd); };
  const oldSkin = { ...MOTO.SKINS.old, dust: dc.dust };
  if (!isCTA) shadowAt(c, o.x + 8, P.y, 190 * P.s, .38);
  const draw1 = (skin, deco, extra = {}) => MOTO.draw(c, { ...o, skin, deco, ...extra });
  if (T < B.sweep) draw1(oldSkin, mkDeco(T));
  else if (swp < 1) {
    // barrido: izquierda = azul nuevo, derecha = vieja (diagonal)
    const lxs = lerp(-115, 105, E.inOutC(swp)), [wx, wy] = L2W(o, lxs, 0), slant = 60 * o.s;
    const poly = (left) => { c.beginPath(); const X = wx, Y0 = o.y - 200 * o.s, Y1 = o.y + 40; if (left) { c.moveTo(-2000, Y0); c.lineTo(X + slant, Y0); c.lineTo(X - slant, Y1); c.lineTo(-2000, Y1); } else { c.moveTo(3000, Y0); c.lineTo(X + slant, Y0); c.lineTo(X - slant, Y1); c.lineTo(3000, Y1); } c.closePath(); };
    c.save(); poly(o.flip); c.clip(); draw1(oldSkin, mkDeco(T)); c.restore();
    c.save(); poly(!o.flip); c.clip(); draw1(MOTO.SKINS.blue, null); c.restore();
    // línea de brillo
    c.save(); c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 8; c.shadowColor = '#bfe4ff'; c.shadowBlur = 26; c.beginPath(); c.moveTo(wx + slant, o.y - 200 * o.s); c.lineTo(wx - slant, o.y + 40); c.stroke(); c.restore();
  } else draw1(MOTO.SKINS.blue, null);
  return o;
}

/* ------------------------------------------------ piezas que vuelan (refacciones) y piezas viejas que caen */
function flightTo(T, tArr, S, Tp, dur = .5) {
  const k = clamp((T - (tArr - dur)) / dur); if (T < tArr - dur || T >= tArr) return null;
  const e = E.inOutC(k), mid = [(S[0] + Tp[0]) / 2, Math.min(S[1], Tp[1]) - 160];
  const x = (1 - e) * (1 - e) * S[0] + 2 * (1 - e) * e * mid[0] + e * e * Tp[0], y = (1 - e) * (1 - e) * S[1] + 2 * (1 - e) * e * mid[1] + e * e * Tp[1];
  return { x, y, k, e };
}
function drawFlyingParts(c, T, o) {
  const B = OLD_BEATS, s = o.s, sk = MOTO.SKINS.blue;
  let f;
  if ((f = flightTo(T, B.fw, [1250, 380], L2W(o, 65, 0)))) { c.save(); c.translate(f.x, f.y); c.scale(s * lerp(1.7, 1, f.e), s * lerp(1.7, 1, f.e)); MOTO.wheel(c, 0, 0, (1 - f.k) * -14, sk, { isNew: true }); c.restore(); speedLines(c, T, f.y - 60, f.y + 60, 1, .25, 7, 6); }
  if ((f = flightTo(T, B.rw, [-250, 420], L2W(o, -65, 0)))) { c.save(); c.translate(f.x, f.y); c.scale(s * lerp(1.7, 1, f.e), s * lerp(1.7, 1, f.e)); MOTO.wheel(c, 0, 0, (1 - f.k) * 14, sk, { isNew: true }); c.restore(); }
  if ((f = flightTo(T, B.mir, [900, -100], L2W(o, 36, -97), .45))) { c.save(); c.translate(f.x, f.y); c.rotate((1 - f.e) * 5); const q = s * lerp(1.8, 1, f.e); c.scale(q, q); c.translate(-36, 97); MOTO.mirrorNew(c, sk); c.restore(); }
  if ((f = flightTo(T, B.seat, [-150, 300], L2W(o, -44, -75), .45))) { c.save(); c.translate(f.x, f.y); c.rotate((1 - f.e) * -4); const q = s * lerp(1.8, 1, f.e); c.scale(q, q); c.translate(44, 75); c.fillStyle = '#10141c'; c.fill(MOTO.SH.pad); c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 1.2; c.stroke(MOTO.SH.pad); c.restore(); }
  if ((f = flightTo(T, B.chain, [500, 1500], L2W(o, -42, 10), .45))) { c.save(); c.translate(f.x, f.y); c.rotate((1 - f.e) * 3); const q = s * lerp(1.8, 1, f.e); c.scale(q, q);
    c.strokeStyle = '#e8edf5'; c.lineWidth = 3; c.setLineDash([2.2, 2]); c.beginPath(); c.roundRect(-24, -8, 48, 16, 8); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#c9d0db'; for (const x of [-18, 18]) { c.beginPath(); c.arc(x, 0, 6, 0, TAU); c.fill(); c.fillStyle = '#5b6370'; c.beginPath(); c.arc(x, 0, 2.2, 0, TAU); c.fill(); c.fillStyle = '#c9d0db'; } c.restore(); }
  // aterrizajes: aro + chispas
  for (const [t, [lx, ly]] of [[B.fw, [65, 0]], [B.rw, [-65, 0]], [B.mir, [36, -97]], [B.seat, [-44, -75]], [B.chain, [-42, 10]]]) { const [wx, wy] = L2W(o, lx, ly); ring(c, T, t, wx, wy, 110 * s / 4, .45, '#fff', 8); sparks(c, T, t, wx, wy, 8, .55, 90 * s / 4, Math.round(t * 7), '#fff'); }
}
function drawFallingOld(c, T, o) {
  const B = OLD_BEATS, s = o.s;
  const old = MOTO.SKINS.old;
  const tA = B.fw; if (T >= tA && T < tA + 1.6) { const a = T - tA, [x0, y0] = L2W(o, 65, 0), x = x0 + 520 * a, ang = (x - x0) / (30 * s); c.save(); c.translate(x, y0 + 30 * s * 0 - (a < .25 ? Math.sin(a / .25 * Math.PI) * 60 : 0)); c.scale(s, s); MOTO.wheel(c, 0, 0, ang, old, { isNew: false, sag: .3 }); c.restore(); }
  const tB = B.rw; if (T >= tB && T < tB + 1.6) { const a = T - tB, [x0, y0] = L2W(o, -65, 0), x = x0 - 520 * a, ang = (x - x0) / (30 * s); c.save(); c.translate(x, y0 + 30 * s * 0.1 * (1 - Math.min(1, a * 4)) - (a < .25 ? Math.sin(a / .25 * Math.PI) * 60 : 0)); c.scale(s, s); MOTO.wheel(c, 0, 0, ang, old, { isNew: false, sag: .9 }); c.restore(); }
}

/* ------------------------------------------------ moto roja (llegada) */
function redPose(T) {
  const x = T < 7.0 ? 1700 : lerp(1700, 810, E.outQuart(inv(7.0, 7.55, T)));
  const roll = Math.abs(x - 1700) / (30 * 3.3);
  const wh = .4 * E.outBack(inv(8.5, 8.85, T), 1.6) * (1 - E.inC(inv(9.45, 9.75, T)));
  const brake = impulse(T, 7.38, 5) * (T > 7.38 ? 1 : 0);
  return { x, y: GROUND, s: 3.3, flip: true, roll, wheelie: wh, pitch: .09 * brake };
}
function redEye(T) {
  const e = { lid: .36, tilt: -.2, look: [.75, .03], bags: 0, brow: [-.2, .4], glow: .55 + .3 * pulse(T, 120, 4, 1), wide: 0, pupil: .44, happy: 0, smile: 0 };
  if (T > 8.0) { const k = E.outC(inv(8.0, 8.4, T)); e.happy = .5 * k; e.smile = .7 * k; e.lid = lerp(.36, .1, k); }
  if (T > 8.5 && T < 9.8) { e.glow = 1; e.wide = .3; e.look = [.6, -.5]; e.lid = .05; }
  const b = blink(T, [7.9, 9.0]); if (b > 0) e.lid = Math.max(e.lid, b);
  return e;
}
function drawRedMoto(c, T, lineup = false) {
  let o;
  if (lineup) {
    const k = pop(T, 14.5, .4, 2.2), ph = T * 2;
    o = { x: 250, y: 735 + (1 - clamp(k)) * -400, s: 2.2, flip: false, roll: 0, wheelie: 0, pitch: 0 };
    o.skin = MOTO.SKINS.red; o.parts = { fw: 1, rw: 1, mir: 1, seat: 1, chain: 1 }; o.ang = { f: 0, r: 0 };
    o.eye = { lid: 0, happy: 1, smile: 1, glow: .95, brow: [0, .8], look: [.5, 0], pupil: .46, bags: 0 }; const bk = blink(T, [18.6, 18.8]); if (bk > 0) { o.eye.lid = bk; o.eye.happy = 1 - bk; }
    o.bob = Math.sin(ph) * -2; o.shine = null;
    if (k <= 0) return;
    shadowAt(c, o.x + 8, 735, 190 * 2.2, .4);
    MOTO.draw(c, o); return;
  }
  if (T < 7.0 || T >= 10.0) return;
  const P = redPose(T), A = T < 7.55 ? P.roll : (T > 8.5 && T < 9.75 ? P.roll + (T - 8.5) * 12 : P.roll);
  o = { ...P, skin: MOTO.SKINS.red, parts: { fw: 1, rw: 1, mir: 1, seat: 1, chain: 1 }, ang: { f: A, r: A }, eye: redEye(T) };
  o.shine = T > 7.6 && T < 8.1 ? lerp(-100, 110, E.inOutC(inv(7.6, 8.1, T))) : null;
  o.sq = [1 + .05 * impulse(T, 7.4, 6), 1 - .06 * impulse(T, 7.4, 6)];
  shadowAt(c, o.x + 10, GROUND, 190 * 3.3, .4);
  MOTO.draw(c, o);
  // humo de frenada en la rueda trasera (derecha, porque va hacia la izquierda)
  puffs(c, T, 7.35, o.x + 115, GROUND - 30, 7, .9, 120, -80, 28, '#e5ebf5', 6);
  if (T > 7.0 && T < 7.6) speedLines(c, T, GROUND - 330, GROUND - 40, -1, .45 * (1 - inv(7.3, 7.6, T)), 5, 14);
  return o;
}

/* ------------------------------------------------ capas: mundo, textos, transiciones */
function dayAt(T) {
  const k = inv(2, 2.4, T) * (1 - inv(5.6, 6, T)), osc = .5 + .5 * Math.sin((T - 2) * TAU / 1.0); return lerp(.62, osc, k);   // la luz cambia más rápido justo en cada tiempo del compás
}
function clockAt(T) { const a = T < 2 ? T * .01 : T < 6 ? .02 + (T - 2) * 2.0 : .02 + 8; return .38 + a; }   // 2 vueltas/s → un pico visual por tiempo del compás
function camera(T) {
  const kz = E.inOutSine(inv(8.35, 9.5, T)) * (T < 9.775 ? 1 : 0), push = T < 6.8 ? .06 * E.inOutSine(inv(0, 6, T)) : 0, z = 1 + .18 * kz + push, cx = lerp(540, 690, kz), cy = 960;
  const sh1 = shake(T, 16 * impulse(T, 7.05, 7), 1, 28), sh2 = shake(T, 8 * impulse(T, 7.5, 8), 2, 28), sh3 = shake(T, 5 * impulse(T, 13.0, 8), 4, 28), sh4 = shake(T, 8 * impulse(T, 14.0, 8), 6, 28);
  const pz = 1 + .55 * (1 - E.outQuart(inv(0, .5, T)));       // crash zoom out: arranca encima del ojo y se abre al plano completo
  return { z, cx, cy, pz, px: 735, py: 925, sx: sh1.x + sh2.x + sh3.x + sh4.x, sy: sh1.y + sh2.y + sh3.y + sh4.y };
}
function w2s(T, x, y) { const k = camera(T), X = W / 2 + k.sx + k.z * (x - k.cx), Y = H / 2 + k.sy + k.z * (y - k.cy); return [k.px + k.pz * (X - k.px), k.py + k.pz * (Y - k.py)]; }
function drawWorld(c, T) {
  const sceneA = T < 7.0, sceneB = T >= 7.0 && T < 14.0;
  if (sceneA) garageBg(c, T, dayAt(T), clockAt(T), T >= 2 && T < 6);
  else if (sceneB) brandBg(c, T, T >= 10 ? { c0: '#3aa6f5', c1: '#1272cc', c2: '#073a80' } : {});
  else ctaBg(c, T);
  // luz de ventana sobre la moto durante el time-lapse
  let oldO = null;
  if (T >= 10 && T < 14) drawFallingOld(c, T, { ...oldPose(T) });
  if (T < 14) { oldO = drawOldMoto(c, T); }
  if (T >= 10 && T < 14 && oldO) drawFlyingParts(c, T, oldO);
  if (T >= 7 && T < 10) drawRedMoto(c, T);
  if (T >= 13.45 && T < 14) { const [wx, wy] = L2W(oldO, 0, -60); ring(c, T, 13.5, wx, wy, 420, .5, '#bfe4ff', 12); }
  // burst de brillos al terminar la pintura
  if (oldO && T >= 13.0 && T < 13.9) { const [bx, by] = L2W(oldO, 0, -60); sparks(c, T, 13.2, bx, by, 22, .8, 420, 5, '#fff'); sparks(c, T, 13.3, bx, by, 14, .8, 300, 8, '#bfe4ff'); }
  if (T >= 14) {
    // lineup CTA: roja (izq.) y azul (der.) frente a frente
    const k = pop(T, 14.5, .4, 2.2);
    shadowAt(c, 730 + 8, 735, 190 * 2.2, .4 * clamp(k));
    drawOldMotoCTA(c, T, k);
    drawRedMoto(c, T, true);
  }
}
function drawOldMotoCTA(c, T, k) {
  const P = oldPose(T), ph = T * 2, y = P.y + (1 - clamp(k)) * -420;
  if (k <= 0) return;
  const eye = { lid: 0, bags: 0, happy: 1, smile: 1, glow: .95, look: [.5, 0], pupil: .46, brow: [0, .8] }; const bk = blink(T, [18.0, 18.2]); if (bk > 0) { eye.lid = bk; eye.happy = 1 - bk; }
  MOTO.draw(c, { ...P, y, skin: MOTO.SKINS.blue, parts: { fw: 1, rw: 1, mir: 1, seat: 1, chain: 1 }, ang: { f: 0, r: 0 }, sq: [1, 1], bob: Math.sin(ph + 1) * -2, eye });
}

/* ------------------------------------------------ textos */
function slamTxt(c, str, x, y, size, t, t0, o = {}) {
  const k = pop(t, t0, .26, 3), a = clamp(inv(t0, t0 + .06, t)); if (a <= 0) return;
  c.save(); c.globalAlpha = a; c.translate(x, y); c.scale(lerp(1.35, 1, clamp(k)) * (k > 1 ? 1 : 1), lerp(1.35, 1, clamp(k))); c.rotate(o.rot || 0);
  txt(c, str, 0, 0, { size, fill: o.fill || '#fff', stroke: o.stroke, strokeW: o.strokeW, shadow: o.shadow || 'rgba(2,8,24,.55)', shadowBlur: size * .2, shadowY: size * .06, maxW: o.maxW, tracking: o.tracking, role: 'key' });
  c.restore();
}
function overlay(c, T) {
  // ---------- GANCHO 0–2.4
  if (T < 2.1) {
    const out = E.inC(inv(1.85, 2.05, T)), y = -out * 50, a = 1 - out;
    c.save(); c.translate(0, y); c.globalAlpha = a;
    const k0 = 1 + .16 * impulse(T, 0, 9), k1 = 1 + .12 * impulse(T, .25, 9);
    c.save(); c.translate(CX, 318); c.scale(k0, k0); txt(c, 'TU MOTO', 0, 0, { size: 124, fill: '#fff', shadow: 'rgba(2,8,24,.55)', role: 'key' }); c.restore();
    c.save(); c.translate(CX, 456); c.scale(k1, k1); txt(c, 'CUANDO DICES:', 0, 0, { size: 124, fill: '#fff', shadow: 'rgba(2,8,24,.55)', maxW: 860, role: 'key' }); c.restore();
    c.restore();
  }
  if (T >= .15 && T < 2.45) {            // burbuja del dueño: se "escribe" rápido, vive hasta 2.4
    const q = '“Ahorita la arreglo”', n = Math.floor(clamp((T - .15) / .35) * q.length), ex = inv(2.25, 2.42, T);
    bubble(c, q, CX, 596, { size: 50, bg: C.blue, fg: '#fff', tail: [330, -92], tx: 250, sc: clamp(pop(T, .15, .2, 2)) * (1 - E.inC(ex) * .5), alpha: 1 - ex, shown: q.slice(0, n) });
  }
  // ---------- ABANDONO 2–6
  if (T >= 2 && T < 6.75) {
    const out = E.inC(inv(6.5, 6.7, T));
    c.save(); c.globalAlpha = 1 - out;
    const k = pop(T, 2.0, .3, 3);
    c.save(); c.translate(CX, 384); c.scale(lerp(1.4, 1, clamp(k)), lerp(1.4, 1, clamp(k))); txt(c, 'AHORITA', 0, 0, { size: 190, fill: '#fff', shadow: 'rgba(2,8,24,.55)', role: 'key' }); c.restore();
    const ct = [[2.5, '1 MES'], [3.5, '6 MESES'], [4.5, '1 AÑO'], [5.5, '3 AÑOS']];
    ct.forEach(([t0, s], i) => { const t1 = i < 3 ? ct[i + 1][0] + .12 : 6.75; if (T >= t0 && T < t1) { const kk = pop(T, t0, .24, 3); pill(c, s, CX, 536, { size: 112, bg: C.red, fg: '#fff', sc: lerp(1.5, 1, clamp(kk)), rot: -.03, alpha: clamp(inv(t0, t0 + .05, T)) * (1 - inv(t1 - .12, t1, T)) }); } });
    c.restore();
  }
  // subtítulo de la moto: …ahorita.
  if (T >= 5.2 && T < 6.5) { const a = win(T, 5.2, 6.5, .12, .2), o = oldPose(T); const tx = w2s(T, L2W(o, 55, 0)[0], 0)[0] - CX; bubble(c, '…ahorita.', CX, 1420, { size: 56, tail: [tx, -100], tx, sc: lerp(.6, 1, E.outBack(clamp(inv(5.2, 5.4, T)), 2)), alpha: a }); }
  // ---------- LLEGADA 6–10
  if (T >= 7.5 && T < 10.0) {
    const out = E.inC(inv(9.6, 9.8, T)); c.save(); c.translate(0, -out * 50); c.globalAlpha = 1 - out;
    slamTxt(c, 'SÍ HAY', CX, 312, 92, T, 7.5, { fill: '#fff' });
    const k = pop(T, 7.55, .28, 3); c.save(); c.globalAlpha = clamp(inv(7.55, 7.6, T)); pill(c, 'MOTOS', CX, 462, { size: 190, bg: C.red, fg: '#fff', sc: lerp(1.4, 1, clamp(k)), rot: -.03 }); c.restore();
    c.restore();
  }
  if (T >= 8.0 && T < 9.4) { const a = win(T, 8.0, 9.4, .1, .2), o = oldPose(T); const bx = CX - 120, tx = w2s(T, L2W(o, 55, 0)[0], 0)[0] - bx; bubble(c, '¿Y ella?', bx, 1420, { size: 60, tail: [tx, -100], tx, sc: lerp(.6, 1, E.outBack(clamp(inv(8.0, 8.2, T)), 2)), alpha: a }); }
  // ---------- REFACCIONES 10–14
  if (T >= 10.25 && T < 13.95) {
    const out = E.inC(inv(13.55, 13.8, T)); c.save(); c.translate(0, -out * 50); c.globalAlpha = 1 - out;
    slamTxt(c, 'SÍ HAY', CX, 312, 92, T, 10.25, { fill: '#fff' });
    const k = pop(T, 10.3, .28, 3); c.save(); c.globalAlpha = clamp(inv(10.3, 10.35, T)); pill(c, 'REFACCIONES', CX, 462, { size: 150, bg: '#fff', fg: C.red, sc: lerp(1.4, 1, clamp(k)), rot: .025, shadow: 'rgba(0,0,0,0)' }); c.restore();
    c.restore();
  }
  // ---------- CIERRE 14–20   (logo 320 · motos 735 · chips 830 · LLÁMANOS AHORITA 1000 · tel 1240 · horario/dirección 1335–1445)
  if (T >= 14.0) {
    const lk = pop(T, 14.05, .5, 2.2);
    drawLogo(c, CX, 322, 780, { sc: lerp(1.5, 1, clamp(lk)), alpha: clamp(inv(14.0, 14.12, T)), shine: inv(14.35, 15.0, T) });
    const kk = pop(T, 15.2, .3, 2.6);
    if (T >= 15.2) { c.save(); c.globalAlpha = clamp(inv(15.2, 15.28, T));
      pill(c, 'MOTOS', CX - 190, 836, { size: 72, bg: C.red, fg: '#fff', sc: lerp(1.3, 1, clamp(kk)) });
      pill(c, 'REFACCIONES', CX + 150, 836, { size: 72, bg: '#fff', fg: C.red, sc: lerp(1.3, 1, clamp(kk)), shadow: 'rgba(0,0,0,0)' }); c.restore(); }
    if (T >= 15.8) { const a = fadeIn(T, 15.8, 16.1), dy = (1 - a) * 24; c.save(); c.globalAlpha = a; c.translate(0, dy);
      txt(c, CONFIG.hours, CX, 1374, { size: 52, font: FT, weight: 800, fill: '#fff', maxW: 840, shadow: 'rgba(0,0,0,.5)', role: 'key' });
      txt(c, CONFIG.addr1, CX, 1428, { size: 46, font: FT, weight: 600, fill: '#e6eefb', maxW: 840, shadow: 'rgba(0,0,0,.5)', role: 'key' });
      txt(c, CONFIG.addr2, CX, 1478, { size: 46, font: FT, weight: 600, fill: '#e6eefb', maxW: 840, shadow: 'rgba(0,0,0,.5)', role: 'key' }); c.restore(); }
    if (T >= 16.5) { const k2 = pop(T, 16.5, .3, 3); c.save(); c.globalAlpha = clamp(inv(16.5, 16.55, T)); c.translate(CX, 1040); c.scale(lerp(1.3, 1, clamp(k2)), lerp(1.3, 1, clamp(k2)));
      txt(c, 'LLÁMANOS', 0, -46, { size: 92, fill: '#fff', shadow: 'rgba(2,8,24,.55)', role: 'key' });
      pill(c, 'AHORITA', 0, 52, { size: 132, bg: C.red, fg: '#fff', rot: -.02 }); c.restore(); }
    for (const [tt, xx, yy] of [[17.5, 130, 1190], [18.1, 840, 1220], [18.7, 480, 1170]]) sparks(c, T, tt, xx, yy, 5, .6, 70, Math.round(tt * 10), '#fff6c8');
    if (T >= 17.0) { const k3 = pop(T, 17.0, .3, 3); c.save(); c.globalAlpha = clamp(inv(17.0, 17.05, T)); c.translate(CX, 1288); c.scale(lerp(1.25, 1, clamp(k3)), lerp(1.25, 1, clamp(k3)));
      txt(c, CONFIG.phone, 0, 0, { size: 140, fill: C.yellow, shadow: 'rgba(2,8,24,.6)', maxW: 840, role: 'key' }); c.restore(); }
  }
}

/* ------------------------------------------------ barridos de marca (rojo · blanco · azul) */
function wipeStripes(c, t0, T) {
  const p = clamp((T - t0) / WD); if (p <= 0 || p >= 1) return;
  const L = 1900, lead = (W + 300) - E.inOutC(p) * (W + L + 600), sk = .34;
  const band = (x0, w, col) => { c.fillStyle = col; c.beginPath(); c.moveTo(x0 + sk * H / 2, 0); c.lineTo(x0 + w + sk * H / 2, 0); c.lineTo(x0 + w - sk * H / 2, H); c.lineTo(x0 - sk * H / 2, H); c.closePath(); c.fill(); };
  c.save(); band(lead, 140, C.blue); band(lead + 140, 90, '#fff'); band(lead + 230, L - 460, C.red); band(lead + L - 230, 90, '#fff'); band(lead + L - 140, 140, C.blue); c.restore();
}
function seam(c, T) {
  // empuje al cuadro 0: lo de la derecha entra, lo actual sale a la izquierda
  const p = Math.pow(clamp(inv(19.6, 19.95, T)), 3), A = off('sA'), B = off('sB');
  frame(A.getContext('2d'), Math.min(T, 19.999), true); frame(B.getContext('2d'), 0, true);
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H);
  const x = p * W, bl = 30 * Math.sin(Math.PI * p); for (let i = 0; i < 4; i++) { c.globalAlpha = i === 0 ? 1 : .2 * Math.min(1, bl / 8); c.drawImage(A, -x - i * bl, 0); c.drawImage(B, W - x + i * bl, 0); } c.globalAlpha = 1;
}
const _bufs = {}; function off(k) { let b = _bufs[k]; if (!b) { b = _bufs[k] = document.createElement('canvas'); b.width = W; b.height = H; } return b; }

/* ------------------------------------------------ composición de un cuadro */
function frame(c, T, noPost) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H);
  const cam = camera(T);
  c.save(); c.translate(cam.px, cam.py); c.scale(cam.pz, cam.pz); c.translate(-cam.px, -cam.py);
  c.translate(W / 2 + cam.sx, H / 2 + cam.sy); c.scale(cam.z, cam.z); c.translate(-cam.cx, -cam.cy);
  drawWorld(c, T);
  c.restore();
  overlay(c, T);
  for (const w of WIPES) wipeStripes(c, w, T);
  // destellos de impacto (≤3/s)
  const fl = Math.max(.5 * impulse(T, 7.0, 22) * (T >= 7 ? 1 : 0), .25 * impulse(T, 13.0, 20) * (T >= 13.0 ? 1 : 0));
  if (fl > .02 && !STAGE.RM) { c.fillStyle = `rgba(255,255,255,${fl})`; c.fillRect(0, 0, W, H); }
  grain(c, T, T < 7 ? .42 : .3);
}

/* ------------------------------------------------ partitura (todo sintetizado) */
const SCORE = Score({ bpm: CONFIG.bpm }, ({ at, sc, steps, drums, groove, motif, BEAT, STEP }) => {
  // — GANCHO: cuarto en silencio, tic-tac y "tecleo" de la burbuja
  sc('hook', 0, (G, w) => { ambience(G, w, 2.2, 360, .03, 0); stamp(G, w, .5); boom(G, w, .3); });
  steps(0, 2.0, (t, s) => { if (s % 4 === 0) at(t + .01, (G, w) => blip(G, w, 96 + (s % 8 === 0 ? 0 : -5), .035, .09, .1, .25)); });
  const typed = 'Ahorita la arreglo'; for (let i = 0; i < typed.length; i++) sc('hook', .3 + i * (.8 / typed.length), (G, w) => typeTick(G, w, i, .085));
  sc('hook', 1.55, (G, w) => { noiseV(G, w, .7, { ft: 'lowpass', f: 1500, fTo: 260, vol: .14, d: .3, s: .2, rev: .2, pan: -.4 }); downer(G, w, .6, .1); });
  sc('hook', 1.5, (G, w) => whistle(G, w, 420, 180, .5, .04, .2));
  [0, .5, 1.0].forEach(t => sc('hook', t, (G, w) => noiseV(G, w, .16, { ft: 'lowpass', f: 900, fTo: 200, vol: .12, d: .08, s: .2, pan: -.3 })));
  // — ABANDONO: tic-tac acelerando, sellos, pájaro, tape-stop
  sc('lapse', 0, (G, w) => { stamp(G, w, .55); boom(G, w, .5); ambience(G, w, 4, 300, .024, 0); });
  [0, 1, 2, 3].forEach(i => sc('lapse', i, (G, w) => whoosh(G, w, .9, .07, -.5, .5, 220, 900)));
  let tt = 0, gap = .25; while (tt < 3.9) { const t = tt; sc('lapse', t, (G, w) => blip(G, w, 100 + ((Math.round(t * 4)) % 2 ? 0 : -4), .03, .075, 0, .25)); tt += gap; gap = Math.max(.07, gap * .93); }
  [.5, 1.5, 2.5, 3.5].forEach((t, i) => sc('lapse', t, (G, w) => { stamp(G, w, .42); noiseV(G, w, .08, { ft: 'bandpass', f: 1400 + i * 300, vol: .11 }); }));
  sc('lapse', 1.4, (G, w) => boing(G, w, .1, .2));                                  // brota la planta
  [2.0, 2.45].forEach(t => sc('lapse', t, (G, w) => { tone(G, w, 3100, .07, { type: 'sine', vol: .06, slide: 4, rev: .15 }); tone(G, w + .09, 3500, .07, { type: 'sine', vol: .055, slide: -3, rev: .15 }); }));
  sc('lapse', 3.1, (G, w) => { downer(G, w, .45, .1); tapeStop(G, w, [57, 60, 64]); });
  sc('lapse', 1.2, (G, w) => riser(G, w, 2.7, .06));
  // — LLEGADA: silencio + motor lejano → barrido → caída del beat
  sc('arrive', .4, (G, w) => engine(G, w, .6, t => ({ rpm: lerp(1.6, 4.6, E.inQ(t / .6)), gain: lerp(.15, .9, t / .6), pan: .85 - t / .6 * .4 })));
  sc('arrive', .55, (G, w) => riser(G, w, .45, .11));
  sc('arrive', .775, (G, w) => whoosh(G, w, .5, .2, .8, -.8, 300, 3200));
  sc('arrive', 1.0, (G, w) => { boom(G, w, .75); crash(G, w, .2); engine(G, w, .6, t => ({ rpm: lerp(7.5, 3, E.outC(t / .6)), gain: lerp(1.2, .1, t / .6), pan: lerp(.9, -.1, E.outQuart(t / .55)) }), .12); noiseV(G, w + .22, .4, { ft: 'bandpass', f: 3200, fTo: 700, q: 2.5, vol: .12, d: .2, s: .3, rev: .2 }); });
  drums(sc('arrive', 1.0), sc('cta', 5.5), { kick: 'x...x...x...x...', clap: '....X.......X...', hat: 'x.x.x.x.x.x.x.xo' }, { swing: .02, vol: 1.0 });
  groove(sc('arrive', 1.0), sc('cta', 5.5), ['Am', 'F', 'C', 'G'], 2, { arp: false, bassVol: .24, padVol: .034 });
  { const prog = ['Am', 'F', 'C', 'G'], t0 = sc('arrive', 1.0);       // stabs sincopados en medios (se oyen en bocinas chicas)
    steps(t0, sc('cta', 5.5), (t, s) => { const st = s % 16; if (![3, 6, 10, 14].includes(st)) return; const ch = CH[prog[Math.floor((t - t0) / 2) % 4]];
      at(t, (G, w) => epiano(G, w, ch.map(m => m + 12), STEP * 2.2, .06)); }); }
  motif([[0, 2, 69], [3, 1, 72], [4, 2, 76], [8, 2, 74], [11, 1, 72], [12, 4, 69]], sc('arrive', 1.0), sc('fix', 4), { tr: 0, inst: (G, w, m, d) => pluck(G, w, m + 12, d + .15, .09, .2), stretch: 1.0 });
  sc('arrive', 1.5, (G, w) => { stamp(G, w, .4); shing(G, w, -.1); });
  sc('arrive', 2.0, (G, w) => blip(G, w, 84, .09, .05, 0, .5));
  sc('arrive', 2.5, (G, w) => engine(G, w, .8, t => ({ rpm: lerp(3, 8.5, E.inQ(t / .8)), gain: lerp(.4, 1, t / .8), pan: .1 }), .1));
  sc('arrive', 3.3, (G, w) => riser(G, w, .45, .1));
  sc('arrive', 3.775, (G, w) => whoosh(G, w, .5, .2, .8, -.8, 300, 3200));
  // — REFACCIONES: cada pieza encaja con un clic y una nota ascendente (Do mayor)
  sc('fix', .25, (G, w) => { stamp(G, w, .35); shing(G, w, .1); });
  [[.5, 72], [1.0, 76], [1.5, 79], [2.0, 84], [2.5, 88]].forEach(([t, m]) => sc('fix', t, (G, w) => { clank(G, w, .08); pluck(G, w, m, .35, .13, .3); kick(G, w, .35); noiseV(G, w, .04, { ft: 'bandpass', f: 2800, vol: .08 }); }));
  [.1, .6, 1.1, 1.6, 2.1].forEach((t, i) => sc('fix', t, (G, w) => whoosh(G, w, .45, .08, i % 2 ? -.6 : .6, i % 2 ? .3 : -.3, 300, 2200)));
  sc('fix', 2.4, (G, w) => riser(G, w, .6, .12));
  sc('fix', 3.0, (G, w) => { shing(G, w, 0); powerUp(G, w, .05); crash(G, w, .12); });
  sc('fix', 3.5, (G, w) => { [72, 76, 79, 84].forEach((m, i) => bell(G, w + i * .03, m, 1.2, .045, (i - 1.5) * .3)); coin(G, w, .05); });
  sc('fix', 3.775, (G, w) => whoosh(G, w, .5, .2, .8, -.8, 300, 3200));
  // — CIERRE: sting de logo, sellos, teléfono tecleado, empuje de bucle
  sc('cta', 0, (G, w) => { boom(G, w, .8); crash(G, w, .22); shing(G, w, 0); });
  sc('cta', .5, (G, w) => { whoosh(G, w, .4, .1, -.5, .5, 400, 2500); stamp(G, w, .3); });
  sc('cta', 1.2, (G, w) => { stamp(G, w, .3); clank(G, w, .04); });
  sc('cta', 2.5, (G, w) => { stamp(G, w, .45); shing(G, w, .1); });
  const digs = CONFIG.phone.replace(/ /g, ''); for (let i = 0; i < digs.length; i++) sc('cta', 3.0 + i * .045, (G, w) => blip(G, w, 79 + (i % 4) * 2, .04, .035, (i % 5 - 2) * .2, .5));
  sc('cta', 3.0, (G, w) => { stamp(G, w, .45); shing(G, w, -.1); });
  sc('cta', 3.8, (G, w) => bell(G, w, 84, 1.4, .04, .2));
  sc('cta', 5.45, (G, w) => whoosh(G, w, .55, .22, .8, -.8, 300, 3400));
});

/* ------------------------------------------------ arranque */
STAGE.run({
  style: 'vector', canvas: cv, format: '9:16', sizes: { '9:16': [1080, 1920] }, bpm: CONFIG.bpm, audio: SCORE, loop: true,
  scenes: [{ id: 'hook', d: 2 }, { id: 'lapse', d: 4 }, { id: 'arrive', d: 4 }, { id: 'fix', d: 4 }, { id: 'cta', d: 6 }],
  prepare: async () => { await Promise.all(['400 40px Anton', '800 40px Inter', '600 40px Inter'].map(f => document.fonts.load(f, 'AHORITA ¿Ñá'))); grain(ctx, 0); },
  draw: (T) => { if (T >= 19.6) seam(ctx, T); else frame(ctx, T); },
});
</script>
